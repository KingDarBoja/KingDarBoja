name: Generate GitHub Stats

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/github-stats.yml'

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVGs
        uses: jstrieb/github-stats@v1
        with:
          LOG_USER_ID: ${{ github.repository_owner_id }}
          USER_NAME: KingDarBoja
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          OUTPUT_FOLDER: assets/stats
          INCLUDE_ALL_COMMITS: true
          EXCLUDE_REPO: KingDarBoja/KingDarBoja

      - name: Commit and push generated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats/
          if git diff --staged --quiet; then
            echo "No changes to stats images."
          else
            git commit -m "chore(stats): update github stats visualizations [skip ci]"
            git push
          fi
